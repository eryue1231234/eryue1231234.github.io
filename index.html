<style>
:root{

  --cold:#C7D5E8;

  --drawer:66.666vw;

}
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0;overflow:hidden;color:var(--ink);background:#18140f}
button{font:inherit}
.app{position:relative;width:100vw;height:100vh;background:linear-gradient(135deg,#efe4d4,#c7d5e8 52%,#efe4d4)}
.map-viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;transition:width .55s ease,filter .55s ease}
.map-viewport.dragging{cursor:grabbing}
.app.detail-open .map-viewport{width:33.334vw;filter:saturate(.75) contrast(.9) blur(.4px)}
.map-world{position:absolute;left:50%;top:50%;width:2100px;height:1260px;transform-origin:center;will-change:transform}
.map-paper{position:absolute;inset:0;overflow:hidden;background:radial-gradient(circle at 20% 18%,rgba(255,255,245,.35),transparent 22%),radial-gradient(circle at 70% 55%,rgba(199,213,232,.25),transparent 25%),repeating-linear-gradient(0deg,rgba(45,31,16,.05) 0 1px,transparent 1px 44px),repeating-linear-gradient(90deg,rgba(45,31,16,.035) 0 1px,transparent 1px 58px),linear-gradient(120deg,#EFE4D4,#C7D5E8 50%,#EFE4D4);box-shadow:inset 0 0 140px rgba(38,24,12,.32)}
.map-paper:before{content:"";position:absolute;inset:34px;border:3px double rgba(53,31,13,.32);border-radius:10px;pointer-events:none}
.map-lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.coast{fill:rgba(239,228,212,.28);stroke:rgba(43,29,15,.48);stroke-width:5}
.coast-thin,.sketch{fill:none;stroke:rgba(43,29,15,.42);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.route{fill:none;stroke:rgba(35,24,15,.62);stroke-width:4;stroke-linecap:round;stroke-dasharray:8 15;animation:routeFlow 16s linear infinite}
@keyframes routeFlow{to{stroke-dashoffset:-260}}
.map-title{position:absolute;z-index:12;top:34px;left:50%;transform:translateX(-50%);font-size:32px;font-weight:700;letter-spacing:8px;color:rgba(31,20,12,.86)}
.region-label{position:absolute;color:rgba(34,23,13,.48);font-size:38px;font-weight:700;letter-spacing:2px;transform:rotate(-4deg);pointer-events:none}
.r1{left:780px;top:408px}.r2{left:1150px;top:660px}.r3{left:1450px;top:348px}.r4{left:620px;top:845px}
.node{position:absolute;z-index:15;width:185px;height:185px;border:0;border-radius:50%;padding:0;background:transparent;cursor:pointer;transform:translate(-50%,-50%);display:grid;place-items:center;transition:transform .22s ease}
.node:before,.node:after{content:"";position:absolute;border-radius:50%;pointer-events:none}
.node:before{inset:0;background:radial-gradient(circle at 46% 40%,rgba(255,249,221,.92),rgba(239,228,212,.76) 55%,rgba(199,213,232,.52));border:3px solid rgba(255,249,223,.66);box-shadow:0 12px 26px rgba(45,29,12,.30),0 0 0 5px rgba(199,213,232,.28)}
.node:after{inset:-12px;border:2px solid rgba(199,213,232,.72);border-left-color:transparent;animation:haloSpin 8s linear infinite}
@keyframes haloSpin{to{transform:rotate(360deg)}}
.node .inner{position:relative;z-index:2;width:148px;height:148px;border-radius:50%;display:grid;grid-template-rows:56px 1fr;align-items:center;justify-items:center;padding:26px 16px 18px;border:2px solid rgba(76,50,20,.30)}
.node .icon{width:54px;height:44px;opacity:.72;background:linear-gradient(rgba(40,25,12,.70),rgba(40,25,12,.70)) center 8px/34px 28px no-repeat;clip-path:polygon(50% 0,90% 28%,80% 100%,20% 100%,10% 28%)}
.node .text{font-size:26px;font-weight:700;line-height:1.12;color:#23170c}
.node.small{width:155px;height:155px}
.node.small .inner{width:124px;height:124px;grid-template-rows:43px 1fr;padding-top:22px}
.node.small .text{font-size:22px}
.node:hover,.node.active{transform:translate(-50%,-50%) scale(1.045)}
.about{left:270px;top:285px}.intern1{left:685px;top:600px}.intern2{left:1030px;top:245px}.intern3{left:1390px;top:545px}.result{left:1580px;top:825px}.project{left:1010px;top:920px}.aiworks{left:520px;top:920px}
.top-ui{position:absolute;z-index:25;left:26px;top:22px;display:flex;align-items:center;gap:12px;color:rgba(255,252,232,.9);pointer-events:none}
.profile-mark{width:54px;height:54px;border-radius:50%;background:rgba(24,29,39,.55);display:grid;place-items:center}
.profile-copy strong{display:block;font-size:18px;letter-spacing:2px}
.profile-copy span{font-size:12px;color:rgba(255,252,232,.68)}
.drawer{position:absolute;z-index:40;top:0;right:0;width:var(--drawer);height:100vh;padding:32px clamp(28px,5vw,76px) 92px;color:#f2ead6;background:linear-gradient(135deg,rgba(18,23,32,.96),rgba(31,28,23,.92));border-left:1px solid rgba(199,213,232,.36);box-shadow:-30px 0 90px rgba(19,15,11,.52);transform:translateX(100%);transition:transform .55s ease;overflow:hidden}
.app.detail-open .drawer{transform:translateX(0)}
.drawer-scroll{height:100%;overflow:auto;padding-right:8px}
.drawer-head{display:flex;justify-content:space-between;gap:22px;border-bottom:1px solid rgba(199,213,232,.28);padding-bottom:20px}
.kicker{margin:0 0 9px;color:var(--cold);font-size:13px;letter-spacing:2px}
.drawer h2{margin:0;color:#fff3d5;font-size:clamp(30px,4vw,58px);line-height:1.1}
.summary{margin:14px 0 0;max-width:760px;color:rgba(242,234,214,.72);font-size:15px;line-height:1.8}
.close{width:38px;height:38px;border:1px solid rgba(199,213,232,.38);border-radius:7px;color:#f2ead6;background:rgba(255,255,255,.04);cursor:pointer}
.detail-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}
.detail-grid.triple-layout{grid-template-columns:repeat(3,minmax(0,1fr))}
.block{min-height:118px;padding:16px;border:1px solid rgba(199,213,232,.22);border-radius:8px;background:rgba(20,24,33,.42)}
.block.wide{grid-column:1/-1}
.block h3{margin:0 0 10px;color:#e5d7b8;font-size:16px}
.block p,.block li{margin:0;color:rgba(242,234,214,.74);font-size:14px;line-height:1.8}
.block ul{margin:0;padding-left:1.15em}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.tag{padding:5px 9px;border:1px solid rgba(199,213,232,.34);border-radius:999px;background:rgba(199,213,232,.10);font-size:12px}
.identity{margin-top:20px;padding:18px;border:1px solid rgba(199,213,232,.22);border-radius:8px;background:rgba(20,24,33,.42)}
.identity h3{margin:0 0 10px;color:#fff3d5;font-size:30px}
.identity p{margin:7px 0;color:rgba(242,234,214,.78);line-height:1.7;font-size:15px}
.edu-row{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.edu-item strong{display:block;color:#fff3d5;margin-bottom:6px}
.edu-item span{display:block;color:rgba(242,234,214,.74);line-height:1.7;font-size:14px}
.project-hero{display:grid;grid-template-columns:minmax(240px,360px) 1fr;gap:18px;margin-top:20px}
.xhs-shot{border:1px solid rgba(199,213,232,.28);border-radius:8px;overflow:hidden;background:rgba(255,255,255,.05)}
.xhs-shot img{display:block;width:100%;height:100%;object-fit:cover}
.project-intro{padding:18px;border:1px solid rgba(199,213,232,.22);border-radius:8px;background:rgba(20,24,33,.42)}
.project-intro h3{margin:0 0 10px;color:#fff3d5;font-size:24px}
.project-intro p{margin:8px 0;color:rgba(242,234,214,.76);font-size:14px;line-height:1.8}
.project-link{display:inline-flex;margin-top:10px;padding:7px 10px;border:1px solid rgba(199,213,232,.34);border-radius:999px;color:#f2ead6;text-decoration:none;background:rgba(199,213,232,.10);font-size:12px}
.project-gallery{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.result-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.gallery-item{display:grid;gap:8px;margin:0}
.gallery-item img{width:100%;display:block;aspect-ratio:3/4;object-fit:cover;border-radius:8px;border:1px solid rgba(199,213,232,.22);background:rgba(255,255,255,.04)}
.result-gallery .gallery-item img{aspect-ratio:9/16}
.collaborator-gallery{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.collaborator-gallery .gallery-item img{aspect-ratio:auto;height:220px;object-fit:contain;padding:6px;box-sizing:border-box;background:rgba(255,255,255,.92)}
.video-gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.video-item{display:grid;gap:8px;margin:0}
.video-item video{width:100%;display:block;aspect-ratio:16/9;object-fit:contain;border-radius:8px;border:1px solid rgba(199,213,232,.22);background:#05070b}
.storyboard-gallery .gallery-item img{aspect-ratio:auto;max-height:720px;object-fit:contain;padding:6px;box-sizing:border-box;background:rgba(255,255,255,.92)}
.gallery-item span,.video-item span{color:rgba(242,234,214,.68);font-size:12px}
.bottom-nav{position:absolute;z-index:45;left:0;right:0;bottom:0;height:66px;display:grid;grid-template-columns:150px 1fr 220px 64px;align-items:center;border-top:1px solid rgba(59,35,14,.20);background:rgba(239,228,212,.78)}
.nav-label,.progress{height:100%;display:grid;align-content:center;padding:0 20px;border-right:1px solid rgba(59,35,14,.16);font-size:13px;font-weight:700;color:rgba(35,24,15,.78)}
.progress span{display:block;margin-top:4px;font-size:12px}
.track{position:relative;height:100%;background:repeating-linear-gradient(90deg,transparent 0 34px,rgba(59,35,14,.18) 35px 37px,transparent 37px 68px);border-right:1px solid rgba(59,35,14,.16)}
.track-fill{position:absolute;left:0;top:0;bottom:0;width:14.28%;background:linear-gradient(90deg,rgba(199,213,232,.34),rgba(239,228,212,.42));transition:width .24s ease}
.nav-buttons{display:flex;align-items:center;justify-content:center;gap:8px;height:100%}
.nav-buttons button{width:34px;height:34px;border:1px solid rgba(59,35,14,.22);border-radius:6px;background:rgba(255,255,245,.36);cursor:pointer;font-size:20px}
@media(max-width:980px){
  :root{--drawer:100vw}
  .app.detail-open .map-viewport{width:0}
  .map-world{width:1650px;height:990px}
  .drawer{padding:24px 18px 84px}
  .detail-grid,.detail-grid.triple-layout,.edu-row,.project-hero,.project-gallery,.result-gallery{grid-template-columns:1fr}
  .bottom-nav{grid-template-columns:1fr 120px 64px}
  .nav-label{display:none}
}
</style>
</head>

function makeBlock(block){

      tag.className = "tag";
      tag.textContent = item;

    });
    el.appendChild(tags);
  }

  if (block.videos){

      const figure = document.createElement("figure");
      figure.className = "video-item";

      video.preload = "metadata";
      video.playsInline = true;
      const cap = document.createElement("span");
      cap.textContent = item.caption;
      figure.append(video, cap);
      gallery.appendChild(figure);
    });
    el.appendChild(gallery);
  }

  if (block.images){
    const gallery = document.createElement("div");
    gallery.className = block.galleryClass || "project-gallery";
    block.images.forEach(item => {
      const figure = document.createElement("figure");
      figure.className = "gallery-item";

      img.alt = item.alt;
      img.loading = "lazy";
      const cap = document.createElement("span");
      cap.textContent = item.caption;
      figure.append(img, cap);
      gallery.appendChild(figure);
    });
    el.appendChild(gallery);
  }

  return el;
}

function openNode(id, open = true){
  active = id;
  const page = pages[id];
  const index = order.indexOf(id);
  const percent = Math.round((index + 1) / order.length * 100);

  nodes.forEach(node => node.classList.toggle("active", node.dataset.id === id));
  kickerEl.textContent = page.kicker;
  titleEl.textContent = page.title;
  summaryEl.textContent = page.summary;
  navLabel.textContent = `当前：${page.title}`;
  progressText.textContent = `${percent}%`;
  trackFill.style.width = `${percent}%`;

  aboutContent.innerHTML = "";
  projectContent.innerHTML = "";
  detail.innerHTML = "";

  if (page.about){
    detail.style.display = "none";
    renderAbout();
  } else if (page.project){
    detail.style.display = "none";
    renderProject();
  } else {
    detail.style.display = "grid";
    detail.className = page.layout === "triple" ? "detail-grid triple-layout" : "detail-grid";
    detail.replaceChildren(...page.blocks.map(makeBlock));
  }

  if (open) app.classList.add("detail-open");
}

function step(direction){
  const next = (order.indexOf(active) + direction + order.length) % order.length;
  openNode(order[next], true);
}

viewport.addEventListener("pointerdown", event => {
  if (event.target.closest("button")) return;
  drag = { pointerId:event.pointerId, startX:event.clientX, startY:event.clientY, baseX:offset.x, baseY:offset.y };
  viewport.setPointerCapture(event.pointerId);
  viewport.classList.add("dragging");
});

viewport.addEventListener("pointermove", event => {
  if (!drag || drag.pointerId !== event.pointerId) return;
  offset.x = drag.baseX + event.clientX - drag.startX;
  offset.y = drag.baseY + event.clientY - drag.startY;
  setWorldTransform();
});

function endDrag(event){
  if (!drag || drag.pointerId !== event.pointerId) return;
  drag = null;
  viewport.classList.remove("dragging");
}

viewport.addEventListener("pointerup", endDrag);
viewport.addEventListener("pointercancel", endDrag);
nodes.forEach(node => node.addEventListener("click", () => openNode(node.dataset.id, true)));
document.getElementById("close").addEventListener("click", () => app.classList.remove("detail-open"));
document.getElementById("prev").addEventListener("click", () => step(-1));
document.getElementById("next").addEventListener("click", () => step(1));

addEventListener("keydown", event => {
  if (event.key === "Escape") app.classList.remove("detail-open");
  if (event.key === "ArrowLeft") step(-1);
  if (event.key === "ArrowRight") step(1);
});

addEventListener("resize", () => {
  scale = innerWidth < 980 ? .72 : .83;
  setWorldTransform();
});

setWorldTransform();
openNode("about", false);
